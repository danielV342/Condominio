<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <style>
    /* ========================= RESET & VARIÁVEIS ========================= */
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: #0f172a;
      --input-border: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      color-scheme: dark; /* Garante que o calendário do input date fique escuro */
    }

    /* ========================= CARD PRINCIPAL ========================= */
    .box {
      width: 100%;
      max-width: 400px;
      padding: 35px 30px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-title {
      text-align: center;
      margin-bottom: 28px;
    }

    .header-title h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header-title p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ========================= CAMPOS & INPUTS ========================= */
    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.icon-left {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      transition: stroke 0.2s;
    }

    input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    input:focus + svg.icon-left,
    .input-wrapper:focus-within svg.icon-left {
      stroke: var(--primary);
    }

    /* Botão Mostrar/Ocultar Senha */
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      width: auto;
      margin: 0;
    }

    .toggle-password:hover {
      color: var(--text-main);
      background: none;
    }

    /* Adjust padding for input password to not overlap the eye icon */
    input[type="password"], 
    input[data-pass="true"] {
      padding-right: 42px;
    }

    /* Ajuste visual para data */
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.6;
      filter: invert(0.8);
      transition: 0.2s;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* ========================= BOTÃO ========================= */
    .btn-submit {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
    }

    /* ========================= VOLTAR ========================= */
    .voltar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .voltar:hover {
      color: var(--text-main);
    }

    /* ========================= RESPONSIVO ========================= */
    @media (max-width: 480px) {
      body {
        padding: 15px;
      }
      .box {
        padding: 28px 20px;
        border-radius: 16px;
      }
      .header-title h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<div class="box">
  <div class="header-title">
    <h2>🏢 Criar Conta</h2>
    <p>Preencha os dados abaixo para se cadastrar</p>
  </div>

  <div class="campo">
    <label for="nome">Nome Completo</label>
    <div class="input-wrapper">
      <svg class="icon-left" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input id="nome" type="text" placeholder="Digite seu nome completo" autocomplete="name">
    </div>
  </div>

  <div class="campo">
    <label for="cpf">CPF</label>
    <div class="input-wrapper">
      <svg class="icon-left" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/></svg>
      <input id="cpf" type="text" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off">
    </div>
  </div>

  <div class="campo">
    <label for="nascimento">Data de Nascimento</label>
    <div class="input-wrapper">
      <svg class="icon-left" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <input id="nascimento" type="date">
    </div>
  </div>

  <div class="campo">
    <label for="senha">Senha</label>
    <div class="input-wrapper">
      <svg class="icon-left" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="senha" type="password" placeholder="Digite sua senha" autocomplete="new-password" data-pass="true">
      <button type="button" class="toggle-password" onclick="toggleSenha()" aria-label="Alternar senha">
        <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <button class="btn-submit" onclick="cadastrar()">Cadastrar</button>

  <a class="voltar" onclick="window.location.href='/'">
    ← Voltar para o login
  </a>
</div>

<script>
  const API = "http://127.0.0.1:8000";

  // ----------- ALTERNAR SENHA ----------- //
  function toggleSenha() {
    const input = document.getElementById("senha");
    const icon = document.getElementById("eye-icon");
    if (input.type === "password") {
      input.type = "text";
      icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      input.type = "password";
      icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  }

  // ----------- FETCH PADRÃO ----------- //
  async function apiFetch(url, method="GET", body=null){
    try{
      const res = await fetch(API + url, {
        method,
        headers: {"Content-Type":"application/json"},
        body: body ? JSON.stringify(body) : null
      });

      return await res.json();
    }catch(e){
      alert("Erro ao conectar com o servidor");
      console.error(e);
    }
  }

  // ----------- MÁSCARA CPF ----------- //
  document.getElementById("cpf").addEventListener("input", function(e){
    let v = e.target.value.replace(/\D/g, "");

    if(v.length > 11) v = v.slice(0,11);

    v = v.replace(/(\d{3})(\d)/, "$1.$2");
    v = v.replace(/(\d{3})(\d)/, "$1.$2");
    v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

    e.target.value = v;
  });

  // ----------- VALIDA CPF ----------- //
  function validarCPF(cpf){
    cpf = cpf.replace(/\D/g,'');

    if(cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

    let soma = 0;
    let resto;

    for(let i=1; i<=9; i++){
      soma += parseInt(cpf.substring(i-1,i)) * (11-i);
    }

    resto = (soma * 10) % 11;
    if(resto === 10 || resto === 11) resto = 0;
    if(resto !== parseInt(cpf.substring(9,10))) return false;

    soma = 0;

    for(let i=1; i<=10; i++){
      soma += parseInt(cpf.substring(i-1,i)) * (12-i);
    }

    resto = (soma * 10) % 11;
    if(resto === 10 || resto === 11) resto = 0;
    if(resto !== parseInt(cpf.substring(10,11))) return false;

    return true;
  }

  // ----------- CADASTRO ----------- //
  async function cadastrar(){
    let nome = document.getElementById("nome").value.trim();
    let cpf = document.getElementById("cpf").value;
    let nascimento = document.getElementById("nascimento").value;
    let senha = document.getElementById("senha").value;

    // VALIDAÇÕES
    if(!nome || !cpf || !nascimento || !senha){
      return alert("Preencha todos os campos!");
    }

    if(senha.length < 4){
      return alert("Senha muito curta!");
    }

    if(!validarCPF(cpf)){
      return alert("CPF inválido!");
    }

    let data = await apiFetch("/cadastro", "POST", {
      nome,
      cpf,
      nascimento,
      senha
    });

    if(!data) return;

    if(data.status === "ok"){
      alert("Cadastro realizado com sucesso!");

      // LIMPA CAMPOS
      document.getElementById("nome").value = "";
      document.getElementById("cpf").value = "";
      document.getElementById("nascimento").value = "";
      document.getElementById("senha").value = "";

      window.location.href = "/";
    }else{
      alert(data.mensagem || "Erro ao cadastrar");
    }
  }
</script>

</body>
</html>
