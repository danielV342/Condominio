<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>



<title>Cadastro</title>

<style> /* ========================= RESET ========================= */ *{ box-sizing:border-box; } /* ========================= BODY ========================= */ body{ margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; font-family:Arial, sans-serif; background:linear-gradient( 135deg, #0f172a, #1e293b ); color:white; } /* ========================= CAIXA ========================= */ .box{ width:100%; max-width:380px; padding:35px; background:rgba(255,255,255,0.05); border-radius:15px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); backdrop-filter:blur(10px); } .box h2{ text-align:center; margin-top:0; margin-bottom:30px; font-size:26px; } /* ========================= CAMPOS ========================= */ .campo{ margin-bottom:16px; } .campo label{ display:block; margin-bottom:7px; font-size:14px; color:#cbd5e1; } input{ width:100%; padding:14px; border:none; border-radius:8px; background:#1e293b; color:white; font-size:16px; outline:none; transition:0.2s; } input::placeholder{ color:#94a3b8; } input:focus{ box-shadow:0 0 0 2px #3b82f6; } /* ========================= BOTÃO ========================= */ button{ width:100%; padding:14px; margin-top:10px; border:none; border-radius:8px; background:#3b82f6; color:white; font-size:16px; font-weight:bold; cursor:pointer; transition:0.2s; } button:hover{ background:#2563eb; } button:active{ transform:scale(0.98); } /* ========================= VOLTAR ========================= */ .voltar{ display:block; margin-top:18px; text-align:center; color:#94a3b8; font-size:14px; text-decoration:none; cursor:pointer; } .voltar:hover{ color:white; } /* ========================= CELULAR ========================= */ @media (max-width:480px){ body{ padding:15px; align-items:center; } .box{ max-width:100%; padding:28px 22px; border-radius:12px; } .box h2{ font-size:24px; margin-bottom:25px; } input{ padding:15px; font-size:16px; } button{ padding:15px; font-size:16px; } } /* ========================= CELULAR PEQUENO ========================= */ @media (max-width:350px){ body{ padding:10px; } .box{ padding:25px 18px; } .box h2{ font-size:22px; } } </style>

</head>

<body>

<div class="box">

<h2>🏢 Cadastro</h2>


<div class="campo">

    <label for="nome">
        Nome completo
    </label>

    <input
        id="nome"
        type="text"
        placeholder="Digite seu nome completo"
        autocomplete="name"
    >

</div>


<div class="campo">

    <label for="cpf">
        CPF
    </label>

    <input
        id="cpf"
        type="text"
        placeholder="000.000.000-00"
        inputmode="numeric"
        autocomplete="off"
    >

</div>


<div class="campo">

    <label for="nascimento">
        Data de nascimento
    </label>

    <input
        id="nascimento"
        type="date"
    >

</div>


<div class="campo">

    <label for="senha">
        Senha
    </label>

    <input
        id="senha"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="new-password"
    >

</div>


<button onclick="cadastrar()">
    Cadastrar
</button>


<a
    class="voltar"
    onclick="window.location.href='/'"
>
    ← Voltar para o login
</a>

</div>

<script>

const API = "http://127.0.0.1:8000"

// ----------- FETCH PADRÃO ----------- //
async function apiFetch(url, method="GET", body=null){
    try{
        const res = await fetch(API + url, {
            method,
            headers: {"Content-Type":"application/json"},
            body: body ? JSON.stringify(body) : null
        })

        return await res.json()
    }catch(e){
        alert("Erro ao conectar com o servidor")
        console.error(e)
    }
}

// ----------- MÁSCARA CPF ----------- //
document.getElementById("cpf").addEventListener("input", function(e){
    let v = e.target.value.replace(/\D/g, "")

    if(v.length > 11) v = v.slice(0,11)

    v = v.replace(/(\d{3})(\d)/, "$1.$2")
    v = v.replace(/(\d{3})(\d)/, "$1.$2")
    v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2")

    e.target.value = v
})

// ----------- VALIDA CPF ----------- //
function validarCPF(cpf){
    cpf = cpf.replace(/\D/g,'')

    if(cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false

    let soma = 0
    let resto

    for(let i=1; i<=9; i++){
        soma += parseInt(cpf.substring(i-1,i)) * (11-i)
    }

    resto = (soma * 10) % 11
    if(resto === 10 || resto === 11) resto = 0
    if(resto !== parseInt(cpf.substring(9,10))) return false

    soma = 0

    for(let i=1; i<=10; i++){
        soma += parseInt(cpf.substring(i-1,i)) * (12-i)
    }

    resto = (soma * 10) % 11
    if(resto === 10 || resto === 11) resto = 0
    if(resto !== parseInt(cpf.substring(10,11))) return false

    return true
}

// ----------- CADASTRO ----------- //
async function cadastrar(){

    let nome = document.getElementById("nome").value.trim()
    let cpf = document.getElementById("cpf").value
    let nascimento = document.getElementById("nascimento").value
    let senha = document.getElementById("senha").value

    // VALIDAÇÕES
    if(!nome || !cpf || !nascimento || !senha){
        return alert("Preencha todos os campos!")
    }

    if(senha.length < 4){
        return alert("Senha muito curta!")
    }

    if(!validarCPF(cpf)){
        return alert("CPF inválido!")
    }

    let data = await apiFetch("/cadastro", "POST", {
        nome,
        cpf,
        nascimento,
        senha
    })

    if(!data) return

    if(data.status === "ok"){
        alert("Cadastro realizado com sucesso!")

        // LIMPA CAMPOS
        document.getElementById("nome").value = ""
        document.getElementById("cpf").value = ""
        document.getElementById("nascimento").value = ""
        document.getElementById("senha").value = ""

        window.location.href = "/"
    }else{
        alert(data.mensagem || "Erro ao cadastrar")
    }
}

</script>

</body>
</html>
