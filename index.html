<!DOCTYPE html>

<html lang="pt-br"> <head> <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style> *{ box-sizing: border-box; } body{ margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; font-family:Arial, sans-serif; background:linear-gradient( 135deg, #0f172a, #1e293b ); color:white; } /* ========================= CAIXA DE LOGIN ========================= */ .box{ background:rgba(255,255,255,0.05); padding:40px; border-radius:15px; text-align:center; width:100%; max-width:380px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); backdrop-filter:blur(10px); } .box h2{ margin-top:0; margin-bottom:30px; font-size:26px; } /* ========================= INPUTS ========================= */ input{ width:100%; padding:14px; margin-bottom:15px; border:none; border-radius:8px; background:#1e293b; color:white; font-size:16px; outline:none; transition:0.2s; } input::placeholder{ color:#94a3b8; } input:focus{ box-shadow:0 0 0 2px #3b82f6; } /* ========================= BOTÕES ========================= */ button{ width:100%; padding:14px; border:none; border-radius:8px; background:#3b82f6; color:white; cursor:pointer; margin-top:5px; font-size:16px; font-weight:bold; transition:0.2s; } button:hover{ background:#2563eb; } button:active{ transform:scale(0.98); } /* Botão cadastrar */ .btn-cadastro{ background:#22c55e; } .btn-cadastro:hover{ background:#16a34a; } /* ========================= CELULAR ========================= */ @media (max-width:480px){ body{ padding:15px; } .box{ padding:30px 22px; max-width:100%; border-radius:12px; } .box h2{ font-size:24px; margin-bottom:25px; } input{ padding:15px; font-size:16px; } button{ padding:15px; font-size:16px; } } /* ========================= CELULARES MUITO PEQUENOS ========================= */ @media (max-width:350px){ .box{ padding:25px 18px; } .box h2{ font-size:22px; } } </style>

</head>

<body>

<div class="box">

<h2>🏢 Login</h2>

<input
    id="user"
    type="text"
    placeholder="CPF"
    autocomplete="username"
>

<input
    id="pass"
    type="password"
    placeholder="Senha"
    autocomplete="current-password"
>

<button onclick="login()">
    Entrar
</button>


</div>

<script>

const API = "http://127.0.0.1:8000"

// ----------- FETCH PADRÃO ----------- //
async function apiFetch(url, method="GET", body=null){
    try{
        const res = await fetch(API + url, {
            method,
            headers: {"Content-Type":"application/json"},
            body: body ? JSON.stringify(body) : null
        })

        return await res.json()
    }catch(e){
        alert("Erro ao conectar com servidor")
        console.error(e)
    }
}

// ----------- MOSTRAR SENHA ----------- //
function toggleSenha(){
    let input = document.getElementById("pass")
    input.type = input.type === "password" ? "text" : "password"
}

// ----------- LOGIN ----------- //
async function login(){

    let cpf = document.getElementById("user").value.trim()
    let senha = document.getElementById("pass").value.trim()

    if(!cpf || !senha){
        return alert("Preencha todos os campos!")
    }

    let data = await apiFetch("/login", "POST", {
        cpf,
        senha
    })

    if(!data) return

    if(data.status === "erro"){
        alert("CPF ou senha inválidos")
        return
    }

    // SALVA USUÁRIO
    localStorage.setItem("tipo", data.tipo)
    localStorage.setItem("usuario", JSON.stringify({
        nome: data.nome,
        cpf: data.cpf
    }))

    // FUTURO: TOKEN JWT
    if(data.token){
        localStorage.setItem("token", data.token)
    }

    console.log(data)

const tipo = data.tipo?.trim().toLowerCase()

console.log(tipo)

if(tipo === "sindico"){
    alert("INDO PARA ADMIN")
    window.location.href = "admin.html"
}else{
    alert("INDO PARA DASHBOARD")
    window.location.href = "dashboard.html"
}
}

</script>

</body>
</html>
